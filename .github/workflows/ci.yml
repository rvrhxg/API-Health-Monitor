name: Python utility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q
      - name: Local outage demonstration
        run: |
          set +e
          python health_monitor.py --demo --csv demo.csv > demo.jsonl
          code=$?
          set -e
          test "$code" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.python }}
          path: |
            demo.csv
            demo.jsonl
